<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPKLU Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .custom-popup .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #1e293b;
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
        }
        .popup-title {
            font-weight: 700;
            font-size: 13px;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .popup-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 9999px;
            margin-bottom: 6px;
        }
        .badge-tersedia { background-color: #d1fae5; color: #065f46; }
        .badge-terpakai { background-color: #fef3c7; color: #92400e; }
        .badge-maintenance { background-color: #fee2e2; color: #991b1b; }
        .popup-text {
            font-size: 11px;
            color: #475569;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map;
        var marker;

        function initMap(lat, lng, name, address, chargerType, status) {
            lat = lat || -7.2654;
            lng = lng || 112.7482;

            map = L.map('map', {
                zoomControl: true
            }).setView([lat, lng], 15);

            // OpenStreetMap community tile server (No API key, No 429 rate limit)
            L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            if (name) {
                updateLocation(lat, lng, name, address, chargerType, status);
            }
        }

        function updateLocation(lat, lng, name, address, chargerType, status) {
            if (!map) {
                initMap(lat, lng, name, address, chargerType, status);
                return;
            }

            map.flyTo([lat, lng], 16, {
                animate: true,
                duration: 0.8
            });

            if (marker) {
                map.removeLayer(marker);
            }

            var badgeClass = 'badge-tersedia';
            if (status === 'Terpakai') badgeClass = 'badge-terpakai';
            else if (status === 'Maintenance') badgeClass = 'badge-maintenance';

            var popupContent = '<div class="custom-popup">' +
                '<div class="popup-title">' + (name || 'SPKLU') + '</div>' +
                '<span class="popup-badge ' + badgeClass + '">' + (status || 'Tersedia') + '</span>' +
                '<div class="popup-text">' +
                '<strong>Tipe:</strong> ' + (chargerType || '-') + '<br/>' +
                '<strong>Alamat:</strong> ' + (address || '-') +
                '</div></div>';

            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup(popupContent)
                .openPopup();
        }

        window.addEventListener('DOMContentLoaded', function() {
            initMap(-7.2654, 112.7482, 'SPKLU PLN UID Jawa Timur', 'Jl. Embong Trengguli No. 19-21, Surabaya', 'DC Fast Charging', 'Tersedia');
        });
    </script>
</body>
</html>
