<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPKLU Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .custom-popup .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #1e293b;
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .popup-title {
            font-weight: 700;
            font-size: 14px;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .popup-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 9999px;
            margin-bottom: 6px;
        }
        .badge-tersedia { background-color: #d1fae5; color: #065f46; }
        .badge-terpakai { background-color: #fef3c7; color: #92400e; }
        .badge-maintenance { background-color: #fee2e2; color: #991b1b; }
        .popup-text {
            font-size: 12px;
            color: #475569;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map;
        var marker;

        function initMap(lat, lng, name, address, chargerType, status) {
            if (!lat || !lng) {
                lat = -7.2575; // Default Surabaya
                lng = 112.7521;
            }

            map = L.map('map', {
                zoomControl: true
            }).setView([lat, lng], 15);

            var cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            });

            var esriMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            });

            var cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            });

            cartoVoyager.addTo(map);

            var baseMaps = {
                "Peta Standar (OSM)": cartoVoyager,
                "Peta Terang": cartoLight,
                "Peta Jalan Esri": esriMap
            };
            L.control.layers(baseMaps).addTo(map);

            if (name) {
                setMarker(lat, lng, name, address, chargerType, status);
            }
        }

        function setMarker(lat, lng, name, address, chargerType, status) {
            if (!map) {
                initMap(lat, lng, name, address, chargerType, status);
                return;
            }

            if (marker) {
                map.removeLayer(marker);
            }

            map.flyTo([lat, lng], 16, {
                animate: true,
                duration: 1.2
            });

            var badgeClass = 'badge-tersedia';
            if (status === 'Terpakai') badgeClass = 'badge-terpakai';
            else if (status === 'Maintenance') badgeClass = 'badge-maintenance';

            var popupContent = `
                <div class="custom-popup">
                    <div class="popup-title">${name || 'SPKLU'}</div>
                    <span class="popup-badge ${badgeClass}">${status || 'Tersedia'}</span>
                    <div class="popup-text">
                        <strong>Tipe:</strong> ${chargerType || '-'}<br/>
                        <strong>Alamat:</strong> ${address || '-'}
                    </div>
                </div>
            `;

            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup(popupContent)
                .openPopup();
        }

        // Initialize with default or query params if present
        window.addEventListener('DOMContentLoaded', () => {
            initMap(-7.2654, 112.7482, 'SPKLU PLN UID Jawa Timur', 'Jl. Embong Trengguli No. 19-21, Surabaya', 'DC Fast Charging', 'Tersedia');
        });
    </script>
</body>
</html>
